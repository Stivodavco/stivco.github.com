<style>

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 48px}
.band{display:block;width:100%;height:22px;color:var(--fresco)}

.group-label{font-weight:700;margin-bottom:10px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip[aria-pressed="true"]{border-color:var(--fresco);background:var(--fresco-soft);color:var(--ink);font-weight:700}
.btn{font:inherit;font-weight:700;font-size:1rem;padding:13px 22px;border-radius:10px;border:none;background:var(--fresco);color:#fff;cursor:pointer}

.btn.ghost{background:transparent;color:var(--fresco);border:1.5px solid var(--fresco)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.note{color:var(--muted);font-size:.9rem;margin-top:14px}
.tiles{display:flex;gap:4px;margin:18px 0 6px;flex-wrap:wrap}
.tile{flex:1 1 0;min-width:10px;height:10px;border-radius:2px;background:var(--line)}
.tile.now{background:var(--fresco)}
.tile.ok{background:var(--green)}
.tile.no{background:var(--red)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.q{margin:22px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--fresco)}
.opt:disabled{cursor:default}
.letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--fresco-soft);color:var(--fresco)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .letter{background:var(--green);color:var(--surface)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);color:var(--surface)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--saffron-soft);border-left:4px solid var(--saffron)}
.feedback strong{display:block;margin-bottom:4px}
.score{font-family:"Marcellus",Georgia,serif;font-size:4.2rem;line-height:1;margin:22px 0 6px;color:var(--fresco)}
.review{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.review li{padding:12px 14px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.review .your{color:var(--red);font-size:.92rem;display:block;margin-top:4px}
.review .ans{color:var(--green);font-size:.92rem;display:block}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

    </div>
    <div class="actions"><button class="btn" id="go">Start test</button></div>
    <p class="note" id="seenNote"></p>
  </section>

  <section id="quiz" class="hidden">

    <div class="actions"><button class="btn hidden" id="next">Next question</button></div>
  </section>

  <section id="done" class="hidden">

    <p id="topicsNote" class="lede"></p>

    <div class="actions">
      <button class="btn" id="again">New test</button>
      <button class="btn ghost" id="settings">Change settings</button>
    </div>
  </section>
</div>

["f","Macedonia","What kind of rule did Macedonia have?","Dynastic and centralised","Direct democracy","A mixed constitution","City states","One ruling family, with no city states."],
["f","Macedonia","Which roles did the Macedonian king hold?","Army general, head of religion, head judge","Only head of religion","Only army general","None, he was ceremonial","The king held all three roles."],
["f","Macedonia","How did the Macedonian king protect free farmers?","He was a counterweight to the aristocracy","He abolished taxes","He let them elect him","He gave them all the land","He made sure aristocrats couldn’t exploit the free farmers."],
["f","Macedonia","Who could join the Macedonian general assembly?","Everyone of fighting age","Only aristocrats","Only the king’s family","Only farmers","The assembly included everyone of fighting age."],
["f","Macedonia","Who divided Alexander’s empire after he died?","His generals","The Persians","The Spartans","The Athenian Ecclesia","His generals split it into 6–8 parts and fought each other."],
["f","Culture","What does “kalos kagathos” mean?","Beautiful and virtuous","Rule by the many","City state","Inherited power","It was the Olympic ideal: beautiful and virtuous."],
["f","Culture","Which Greek is linked to medicine?","Hippocrates","Pericles","Solon","Leonidas","Hippocrates is the famous Greek physician."],
["f","Culture","What is a polis?","A city state","A council","A coin","A temple","Polis = city state."],
["f","Culture","What were the Greeks famous for making?","Ships and ceramics","Iron bridges","Silk","Paper","Your slides say the Greeks were famous for ships and ceramics."]
];

const store = {
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const $ = id => document.getElementById(id);
const show = id => {["start","quiz","done"].forEach(s=>$(s).classList.toggle("hidden",s!==id));$(id).classList.remove("fade");void $(id).offsetWidth;$(id).classList.add("fade");window.scrollTo(0,0)};
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let len = 15, focus = "all", test = [], i = 0, results = [];

function pickChip(groupId, attr, val){
  document.querySelectorAll("#"+groupId+" .chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset[attr]===String(val)));
}
$("lenChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;len=+b.dataset.len;pickChip("lenChips","len",len)});
$("focusChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;focus=b.dataset.focus;pickChip("focusChips","focus",focus);updateNote()});

function pool(){return BANK.map((q,idx)=>({q,idx})).filter(o=>focus==="all"||o.q[0]===focus)}
function updateNote(){
  const seen = new Set(store.get("gq-seen")||[]);
  const p = pool(); const fresh = p.filter(o=>!seen.has(o.idx)).length;
  $("seenNote").textContent = fresh===p.length ? `${p.length} questions in this set.` : `${fresh} of ${p.length} questions in this set you haven’t seen yet.`;
}

function build(){
  let seen = store.get("gq-seen")||[];
  const p = pool();
  let fresh = shuffle(p.filter(o=>!seen.includes(o.idx)));
  if(fresh.length < len){
    const ids = new Set(p.map(o=>o.idx));
    seen = seen.filter(s=>!ids.has(s));
    const old = shuffle(p.filter(o=>!fresh.includes(o)));
    fresh = fresh.concat(old);
  }
  test = fresh.slice(0, Math.min(len, p.length));
  store.set("gq-seen", seen.concat(test.map(o=>o.idx)));
  i = 0; results = [];
  $("tiles").innerHTML = test.map(()=>'<span class="tile"></span>').join("");
  show("quiz"); render();
}

function render(){
  const [ , topic, text, right, ...rest] = test[i].q;
  const opts = shuffle([right, rest[0], rest[1], rest[2]]);
  $("count").textContent = `Question ${i+1} of ${test.length}`;
  $("topic").textContent = topic;
  $("qText").textContent = text;
  $("fb").classList.add("hidden");
  $("next").classList.add("hidden");
  const tiles = $("tiles").children;
  for(let t=0;t<tiles.length;t++){tiles[t].classList.toggle("now",t===i)}
  $("opts").innerHTML = "";
  opts.forEach((o,k)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">${"ABCD"[k]}</span><span></span>`;
    b.lastChild.textContent = o;
    b.addEventListener("click",()=>answer(b,o,right));
    $("opts").appendChild(b);
  });
  $("opts").firstChild.focus({preventScroll:true});
}

function answer(btn, chosen, right){
  const ok = chosen===right;
  const q = test[i].q;
  results.push({q, chosen, ok});
  [...$("opts").children].forEach(b=>{
    b.disabled = true;
    if(b.lastChild.textContent===right) b.classList.add("right");
  });
  if(!ok) btn.classList.add("wrong");
  const tile = $("tiles").children[i];
  tile.classList.remove("now"); tile.classList.add(ok?"ok":"no");
  $("fb").innerHTML = `<strong>${ok?"Correct.":"Not quite."}</strong><span></span>`;
  $("fb").lastChild.textContent = q[7];
  $("fb").classList.remove("hidden");
  $("next").textContent = i===test.length-1 ? "See results" : "Next question";
  $("next").classList.remove("hidden");
  $("next").focus({preventScroll:true});
}

$("next").addEventListener("click",()=>{ if(i<test.length-1){i++;render()} else finish() });

function finish(){
  const score = results.filter(r=>r.ok).length, n = results.length, pct = score/n;
  $("scoreBig").textContent = `${score}/${n}`;
  $("verdict").textContent = pct===1 ? "Perfect score. Try a longer test or switch focus." :
    pct>=.8 ? "Strong result. Look over the few you missed below." :
    pct>=.6 ? "Good base. Review the misses, then take another test." :
    "Keep going. Read through the misses below, then try again.";
  const missed = results.filter(r=>!r.ok);
  const topics = {};
  missed.forEach(r=>topics[r.q[1]]=(topics[r.q[1]]||0)+1);
  const top = Object.entries(topics).sort((a,b)=>b[1]-a[1]).slice(0,3).map(t=>t[0]);
  $("topicsNote").textContent = top.length ? `Topics to revise: ${top.join(", ")}.` : "";
  $("reviewHead").classList.toggle("hidden", !missed.length);
  $("review").innerHTML = "";
  missed.forEach(r=>{
    const li = document.createElement("li");
    li.innerHTML = "<span></span><span class='your'></span><span class='ans'></span>";
    li.children[0].textContent = r.q[2];
    li.children[1].textContent = "Your answer: " + r.chosen;
    li.children[2].textContent = "Correct: " + r.q[3];
    $("review").appendChild(li);
  });
  show("done");
}

$("go").addEventListener("click", build);
$("again").addEventListener("click", build);
$("settings").addEventListener("click", ()=>{updateNote();show("start")});
updateNote();
</script>
